[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-crypto-signal-boy"
version = "1.0.0"
description = "Telegram crypto trade-signal bot using public Binance USDT-M futures data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
signal-bot = "signal_bot.runner:main"

[tool.setuptools.packages.find]
include = ["signal_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
